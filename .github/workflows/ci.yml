  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --keep-vars: cegah Wrangler menghapus variable/secret yang di-set
          # lewat Cloudflare Dashboard (mis. ADMIN_PASSWORD, LIVE_SECRET jika
          # disimpan sebagai tipe Text, bukan Secret asli). Tanpa flag ini,
          # setiap deploy otomatis menghapus var yang tidak ada di wrangler.toml.
          command: deploy --minify --keep-vars