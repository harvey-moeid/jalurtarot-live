name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ââââââââââââââââââââââââââââââââââââââââââââ
  # Type check â semua branch, semua PR
  # ââââââââââââââââââââââââââââââââââââââââââââ
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  # ââââââââââââââââââââââââââââââââââââââââââââ
  # Deploy â hanya push ke master & typecheck lulus
  # ââââââââââââââââââââââââââââââââââââââââââââ
  # TikTok listener validation: dependency resolution + JavaScript syntax check.
  tiktok-listener-check:
    name: TikTok Listener Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install listener dependencies
        working-directory: tiktok-listener
        run: npm install --ignore-scripts

      - name: Verify connector version
        working-directory: tiktok-listener
        run: npm ls tiktok-live-connector --depth=0

      - name: Check listener syntax
        working-directory: tiktok-listener
        run: node --check index.js

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --keep-vars: cegah Wrangler menghapus variable/secret yang di-set
          # lewat Cloudflare Dashboard (mis. ADMIN_PASSWORD, LIVE_SECRET jika
          # disimpan sebagai tipe Text, bukan Secret asli). Tanpa flag ini,
          # setiap deploy otomatis menghapus var yang tidak ada di wrangler.toml.
          command: deploy --minify --keep-vars