version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
