name = "jalurtarot-live"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Static assets — Cloudflare otomatis serve file di folder ini
# sebelum request masuk ke Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "LIVE_QUEUE"
class_name = "LiveReadingQueue"

[[migrations]]
tag = "live_queue_sqlite_v1"
new_sqlite_classes = ["LiveReadingQueue"]

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2545355c3b6e4012a1bddf0c66c181a0"
preview_id = "2545355c3b6e4012a1bddf0c66c181a0"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
# Base URL aman untuk dipublikkan; API key tetap Cloudflare Secret.
TIKTOK_CONNECTOR_URL = "https://tiktok-live-konektor.onrender.com"

# Filter gift untuk Ramalan Live. "*" = semua gift.
LIVE_TARGET_GIFT_NAME = "*"
LIVE_MIN_GIFT_VALUE = "1"
LIVE_THREE_CARD_MIN_VALUE = "5"
LIVE_DEFAULT_SPREAD = "single"

# —— Admin Panel ——
# Password untuk halaman /admin — simpan sebagai secret, JANGAN di sini.
#
#   wrangler secret put ADMIN_PASSWORD          → Password admin panel (WAJIB sebelum deploy)
#
# —— Ramalan Live (TikTok) ——
# Jalur utama memakai API dari repo tiktok-live-konektor.
#
#   wrangler secret put TIKTOK_CONNECTOR_API_KEY
#     -> harus sama dengan API_KEY pada service tiktok-live-konektor.
#
#   wrangler secret put TIKTOK_CONNECTOR_WEBHOOK_SECRET
#     -> token acak untuk POST /api/live/connector-webhook?secret=...
#
# LIVE_SECRET tetap didukung hanya untuk endpoint legacy POST /api/live/trigger.
# Tidak perlu dipakai bila integrasi connector baru sudah aktif.
#
# Untuk dev lokal: taruh secret di file .dev.vars (jangan di-commit!).
