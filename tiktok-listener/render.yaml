# Manual control: listener Render berjalan saat service dinyalakan dari panel admin.
# Tidak ada Cron Job / controller otomatis.
services:
  - type: worker
    name: jalurtarot-tiktok-listener
    runtime: node
    plan: starter
    region: singapore
    rootDir: tiktok-listener
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: TIKTOK_USERNAME
        value: "jalurtarot"
      - key: WORKER_URL
        sync: false
      - key: LIVE_SECRET
        sync: false
      - key: TARGET_GIFT_NAME
        value: "*"
      - key: MIN_GIFT_VALUE
        value: "1"
      - key: THREE_CARD_MIN_VALUE
        value: "5"
      - key: DEFAULT_SPREAD
        value: "single"
      - key: LIKE_MILESTONE
        value: "1000"
      - key: SIGN_API_KEY
        value: ""
      - key: RECONNECT_MIN_MS
        value: "5000"
      - key: RECONNECT_MAX_MS
        value: "60000"
      - key: WORKER_TIMEOUT_MS
        value: "10000"