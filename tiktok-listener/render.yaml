# Model B: listener hanya ON saat TikTok LIVE.
# Cron controller mengecek status LIVE setiap menit dan mengontrol listener.

services:
  - type: worker
    name: jalurtarot-tiktok-listener
    runtime: node
    plan: starter
    region: singapore
    rootDir: tiktok-listener
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: TIKTOK_USERNAME
        value: "jalurtarot"
      - key: WORKER_URL
        sync: false
      - key: LIVE_SECRET
        sync: false
      - key: TARGET_GIFT_NAME
        value: "*"
      - key: MIN_GIFT_VALUE
        value: "1"
      - key: THREE_CARD_MIN_VALUE
        value: "5"
      - key: DEFAULT_SPREAD
        value: "single"
      - key: LIKE_MILESTONE
        value: "1000"
      - key: SIGN_API_KEY
        value: ""

  - type: cron
    name: jalurtarot-tiktok-controller
    runtime: node
    plan: starter
    region: singapore
    rootDir: tiktok-controller
    buildCommand: npm install
    startCommand: npm start
    schedule: "*/1 * * * *"
    autoDeploy: true
    envVars:
      - key: TIKTOK_USERNAME
        value: "jalurtarot"
      - key: RENDER_API_KEY
        sync: false
      - key: LISTENER_SERVICE_NAME
        value: "jalurtarot-tiktok-listener"
      - key: CHECK_TIMEOUT_MS
        value: "20000"
