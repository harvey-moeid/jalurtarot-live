# Render Background Worker. Requires a paid always-on plan.
services:
  - type: worker
    name: jalurtarot-tiktok-listener
    runtime: node
    plan: starter
    region: singapore
    rootDir: tiktok-listener
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: TIKTOK_USERNAME
        value: jalurtarot
      - key: WORKER_URL
        value: https://livejalur.muidsoft.com
      - key: LIVE_SECRET
        sync: false
      - key: EULER_API_KEY
        sync: false
      - key: TARGET_GIFT_NAME
        value: "*"
      - key: MIN_GIFT_VALUE
        value: "1"
      - key: THREE_CARD_MIN_VALUE
        value: "5"
      - key: DEFAULT_SPREAD
        value: single
      - key: LIKE_MILESTONE
        value: "1000"
      - key: RECONNECT_MIN_MS
        value: "5000"
      - key: RECONNECT_MAX_MS
        value: "60000"
      - key: WORKER_TIMEOUT_MS
        value: "10000"
